set -g @plugin "tmux-plugins/tpm"

set -g base-index 1
set -g renumber-windows on
set -g status-position top
set -g status 2
set -g status-format[1] ''
set -g status-style 'bg=default,fg=#c5c9c5'
set -g status-left ''
set -g status-right '#[fg=#a292a3,bg=default]#[fg=#181616,bg=#a292a3,bold] #S #[fg=#a292a3,bg=default,nobold] '
set -g status-right-length 40
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-separator ' '
set -g window-status-format '#[fg=#282727,bg=default]#[fg=#c5c9c5,bg=#282727] #W #[fg=#181616,bg=#8a9a7b] #I #[fg=#8a9a7b,bg=default]'
set -g window-status-current-format '#[fg=#282727,bg=default]#[fg=#c5c9c5,bg=#282727,bold] #W #[fg=#181616,bg=#8ba4b0] #I #[fg=#8ba4b0,bg=default,nobold]'

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n C-S-h resize-pane -L 5
bind-key -n C-S-j resize-pane -D 5
bind-key -n C-S-k resize-pane -U 5
bind-key -n C-S-l resize-pane -R 5
bind-key -n C-t new-window
bind-key -n C-f resize-pane -Z
bind-key -n "C-'" split-window -v
bind-key -n 'C-\' split-window -h

set -s extended-keys on
bind-key -n C-1 select-window -t :1
bind-key -n C-2 select-window -t :2
bind-key -n C-3 select-window -t :3
bind-key -n C-4 select-window -t :4
bind-key -n C-5 select-window -t :5
bind-key -n C-6 select-window -t :6
bind-key -n C-7 select-window -t :7
bind-key -n C-8 select-window -t :8
bind-key -n C-9 select-window -t :9

run "~/.tmux/plugins/tpm/tpm"
